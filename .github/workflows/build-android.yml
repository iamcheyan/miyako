name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master, ralph/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, ralph/* ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  web:
    name: Web checks (tsc / lint / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-android:
    name: Build Android APK (ARM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          build-tools: '36.0.0'
          platforms: 'android-36'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci

      # 图标链：从 icon.png 重新生成全套图标并同步进 Android 壳，
      # 保证 src-tauri/icons 与 gen/android 永不漂移。
      - name: Generate and sync launcher icons
        run: ./generate-icons.sh

      - name: Prepare release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release keystore configured; APK will use debug signing (gradle warns)."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build ARM64 APK (aarch64)
        run: npx tauri android build --target aarch64 --apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build ARMv7 APK (armv7)
        run: npx tauri android build --target armv7 --apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Find and rename APKs
        id: find-apk
        run: |
          echo "=== All APK files ==="
          find src-tauri/gen/android -name "*.apk" 2>/dev/null || true
          echo "========================"

          ARM64_APK=$(find src-tauri/gen/android -name "*.apk" -path "*aarch64*" -o -name "*.apk" -path "*arm64*" | head -1)
          ARMV7_APK=$(find src-tauri/gen/android -name "*.apk" -path "*armv7*" -o -name "*.apk" -path "*armeabi*" | head -1)

          if [ -z "$ARM64_APK" ]; then
            ARM64_APK=$(find src-tauri/gen/android -name "*.apk" | head -1)
          fi
          if [ -z "$ARMV7_APK" ]; then
            ARMV7_APK=$(find src-tauri/gen/android -name "*.apk" | tail -1)
          fi

          if [ -z "$ARM64_APK" ] || [ -z "$ARMV7_APK" ]; then
            echo "❌ Could not find built APKs"
            find src-tauri/gen/android -name "*.apk" 2>/dev/null
            exit 1
          fi

          echo "✅ Found ARM64 APK: $ARM64_APK"
          echo "✅ Found ARMv7 APK: $ARMV7_APK"

          mkdir -p release
          cp "$ARM64_APK" release/miyako-arm64.apk
          cp "$ARMV7_APK" release/miyako-armv7.apk

      # 图标/身份校验：解包 APK 断言 mipmap 图标资源存在 + Manifest 引用
      # 正确的 applicationId/label，且不携带旧壳身份。
      - name: Verify APK icons and identity
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1)"
          for apk in release/miyako-arm64.apk release/miyako-armv7.apk; do
            echo "=== $apk: mipmap entries ==="
            unzip -l "$apk" 'res/mipmap-*/*'
            echo "=== $apk: manifest icon references ==="
            "$AAPT" dump badging "$apk" | grep -E "^application-(icon|label)" || {
              echo "❌ no application-icon/label entries in badging output"
              exit 1
            }
            scripts/verify-android-apk.sh "$apk" com.miyako.app
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: miyako-arm64-apk
          path: release/miyako-arm64.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: miyako-armv7-apk
          path: release/miyako-armv7.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate version tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          VERSION="v${TIMESTAMP}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Version: $VERSION"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          files: |
            release/miyako-arm64.apk
            release/miyako-armv7.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **ARM64 (arm64-v8a)**: Modern Android devices (2016+)" >> $GITHUB_STEP_SUMMARY
          echo "- **ARMv7 (armeabi-v7a)**: Older Android devices" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "### 🚀 Release: $TAG_NAME — APKs attached to the GitHub Release." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Download the APK artifacts from this workflow run (Actions tab)." >> $GITHUB_STEP_SUMMARY
          fi
