[package]
name = "miyako"
version = "0.1.0"
description = "NAS Music Sync - Android offline music player"
authors = ["you"]
edition = "2021"

[lib]
name = "miyako_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smb = "0.11"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "5"
