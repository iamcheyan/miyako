name: Build Android APK

on:
  push:
    branches: [ main, master, ralph/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, ralph/* ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'ralph/nas-music-sync'
        type: choice
        options:
          - main
          - master
          - ralph/nas-music-sync
          - ralph/github-actions-android-apk

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-android:
    name: Build Android APK (ARM)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          build-tools: '36.0.0'
          platforms: 'android-36'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci

      - name: Build ARM64 APK (aarch64)
        run: npx tauri android build --target aarch64 --apk

      - name: Build ARMv7 APK (armv7)
        run: npx tauri android build --target armv7 --apk

      - name: Find and rename APKs
        id: find-apk
        run: |
          # Find built APKs
          ARM64_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*arm64*" | head -1)
          ARMV7_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*arm*" | head -1)
          
          if [ -z "$ARM64_APK" ] || [ -z "$ARMV7_APK" ]; then
            echo "❌ Could not find built APKs"
            exit 1
          fi
          
          echo "✅ Found ARM64 APK: $ARM64_APK"
          echo "✅ Found ARMv7 APK: $ARMV7_APK"
          
          # Create a release directory
          mkdir -p release
          cp "$ARM64_APK" release/miyako-arm64.apk
          cp "$ARMV7_APK" release/miyako-armv7.apk
          
          echo "arm64_apk=release/miyako-arm64.apk" >> $GITHUB_OUTPUT
          echo "armv7_apk=release/miyako-armv7.apk" >> $GITHUB_OUTPUT

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: miyako-arm64-apk
          path: release/miyako-arm64.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: miyako-armv7-apk
          path: release/miyako-armv7.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/miyako-arm64.apk
            release/miyako-armv7.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built APKs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **ARM64 (arm64-v8a)**: Modern Android devices (2016+)" >> $GITHUB_STEP_SUMMARY
          echo "- **ARMv7 (armeabi-v7a)**: Older Android devices" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if this is a tag release
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "### 🚀 Release: $TAG_NAME" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This build was triggered by tag \`$TAG_NAME\`. APKs have been uploaded to the GitHub Release." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Download from Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to the **Releases** page" >> $GITHUB_STEP_SUMMARY
            echo "2. Find **$TAG_NAME**" >> $GITHUB_STEP_SUMMARY
            echo "3. Download \`miyako-arm64.apk\` or \`miyako-armv7.apk\` from the Assets section" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Install from Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Download ARM64 APK" >> $GITHUB_STEP_SUMMARY
            echo "wget https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/miyako-arm64.apk" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Install on Android device" >> $GITHUB_STEP_SUMMARY
            echo "adb install miyako-arm64.apk" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Download" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to the **Actions** tab" >> $GITHUB_STEP_SUMMARY
            echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
            echo "3. Download the APK artifacts from the bottom" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Install on Android" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "adb install miyako-arm64.apk" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi