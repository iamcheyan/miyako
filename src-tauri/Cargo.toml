[package]
name = "nas-music-sync"
version = "0.1.0"
description = "NAS Music Sync - Android offline music player"
authors = ["you"]
edition = "2021"

[lib]
name = "nas_music_sync_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
